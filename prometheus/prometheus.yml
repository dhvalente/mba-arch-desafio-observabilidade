global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/regras/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: api
    static_configs:
      - targets:
          - api:8080

  - job_name: worker
    static_configs:
      - targets:
          - worker:8081
